services:
  - type: web
    name: radenhetsraknare
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: radenhetsraknare-db
          property: connectionString
      - key: API_KEY
        generateValue: true
      - key: NODE_VERSION
        value: "22"

databases:
  - name: radenhetsraknare-db
    plan: free
    region: frankfurt
    databaseName: radenhetsraknare
    user: radenhetsraknare
